# Nginx untuk SAKTI — PRD v2.3 N1 (opsi A: domain + Let's Encrypt)
#
# Berkas ini sengaja HTTP saja. Certbot yang akan menambahkan blok HTTPS
# (listen 443, path sertifikat, dan redirect dari port 80) secara otomatis.
# Jangan menambahkan ssl_certificate manual di sini — berkasnya belum ada,
# dan nginx akan menolak start sehingga certbot ikut gagal.
#
# Pasang:
#   sudo cp nginx-sakti.conf /etc/nginx/sites-available/sakti
#   sudo sed -i "s/sakti\.example\.org/<domain-anda>/g" /etc/nginx/sites-available/sakti
#   sudo ln -sf /etc/nginx/sites-available/sakti /etc/nginx/sites-enabled/sakti
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <domain-anda>

# Dibutuhkan agar header Connection hanya bernilai "upgrade" saat permintaan
# memang websocket. Diletakkan di luar blok server karena sites-enabled
# di-include di dalam konteks http.
map $http_upgrade $sakti_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name sakti.example.org;

    # Unggahan berkas SAKTI (surat, dokumen pendukung)
    client_max_body_size 25m;

    # Endpoint cron hanya boleh dipanggil dari dalam VPS lewat 127.0.0.1:3000.
    # Dari internet selalu 404 (PRD v2.3 K5 / F4.5).
    location ^~ /api/cron/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Host & X-Forwarded-Host dipakai pemeriksaan Origin di API route
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $sakti_connection_upgrade;

        proxy_read_timeout 300s;
    }
}
