<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="sakabot-animated-title"><title id="sakabot-animated-title">SAKABOT — ilustrasi animasi SAKTI</title><defs>
<linearGradient id="sakabot-animated-paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#EEF2FF"/></linearGradient>
<linearGradient id="sakabot-animated-ink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3730A3"/><stop offset="1" stop-color="#000352"/></linearGradient>
<linearGradient id="sakabot-animated-violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#818CF8"/><stop offset="1" stop-color="#3730A3"/></linearGradient>
<linearGradient id="sakabot-animated-edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#818CF8" stop-opacity=".4"/><stop offset="1" stop-color="#818CF8" stop-opacity=".12"/></linearGradient>
<radialGradient id="sakabot-animated-shadow"><stop stop-color="#000352" stop-opacity=".12"/><stop offset="1" stop-color="#000352" stop-opacity="0"/></radialGradient>
</defs><style>
.lift{animation:sakti-lift 6s cubic-bezier(.45,0,.55,1) infinite}.drift{animation:sakti-drift 6s cubic-bezier(.45,0,.55,1) infinite}.blink{transform-box:fill-box;transform-origin:center;animation:sakti-blink 6s ease-in-out infinite}.typing{animation:sakti-typing 2.4s ease-in-out infinite}.second{animation-delay:.2s}.third{animation-delay:.4s}.notice{animation:sakti-notice 6s cubic-bezier(.45,0,.55,1) infinite}.pulse{animation:sakti-pulse 6s ease-in-out infinite}.pen{animation:sakti-pen 6s cubic-bezier(.45,0,.55,1) infinite}.signature{stroke-dasharray:100;stroke-dashoffset:0;animation:sakti-sign 6s ease-in-out infinite}
@keyframes sakti-lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes sakti-drift{0%,100%{transform:translate(0,0)}50%{transform:translate(7px,-5px)}}
@keyframes sakti-blink{0%,39%,46%,100%{transform:scaleY(1)}42%,43%{transform:scaleY(.12)}}
@keyframes sakti-typing{0%,70%,100%{opacity:.4}35%{opacity:1}}
@keyframes sakti-notice{0%,100%{opacity:.7;transform:translateY(3px)}30%,70%{opacity:1;transform:translateY(-2px)}}
@keyframes sakti-pulse{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes sakti-pen{0%,100%{transform:translate(0,0)}35%{transform:translate(5px,-3px)}65%{transform:translate(11px,-1px)}}
@keyframes sakti-sign{0%,100%{stroke-dashoffset:100;opacity:0}15%{opacity:1;stroke-dashoffset:100}65%,85%{opacity:1;stroke-dashoffset:0}95%{opacity:0;stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.lift,.drift,.blink,.typing,.notice,.pulse,.pen,.signature{animation:none}.signature{stroke-dashoffset:0;opacity:1}}
</style><ellipse cx="242" cy="281" rx="148" ry="24" fill="url(#sakabot-animated-shadow)"/>
