<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="386" height="291" viewBox="0 0 386 291" fill="none" role="img" aria-labelledby="gm-title gm-desc">
  <title id="gm-title">Monev SAKTI — data ekonomi keluarga</title>
  <desc id="gm-desc">Ilustrasi keluarga pada kartu data, ikon pekerjaan dan penghasilan, serta kaca pembesar rupiah. Kartu melayang lembut dan kaca pembesar bergerak meninjau data.</desc>
  <style>
.gm-card { animation: gm-float 6s cubic-bezier(.45,0,.55,1) infinite; }
.gm-lens { animation: gm-inspect 6s cubic-bezier(.45,0,.55,1) infinite; }
.gm-shadow { transform-box:fill-box; transform-origin:center; animation:gm-shadow 6s ease-in-out infinite; }
.gm-highlight { animation:gm-highlight 6s ease-in-out infinite; }
.gm-indicator { animation:gm-indicator 6s ease-in-out infinite; }
.gm-eye { transform-box:fill-box; transform-origin:center; animation:gm-blink 8s linear infinite; }
.gm-eye-mother { animation-delay:1.3s; }
.gm-eye-student { animation-delay:2.7s; }
@keyframes gm-float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-4px); } }
@keyframes gm-inspect { 0%,100% { transform:translate(0,0); } 45%,55% { transform:translate(-7px,-5px); } }
@keyframes gm-shadow { 0%,100% { transform:scaleX(1); opacity:1; } 50% { transform:scaleX(.96); opacity:.76; } }
@keyframes gm-highlight { 0%,100% { opacity:.18; } 40%,65% { opacity:.34; } }
@keyframes gm-indicator { 0%,100% { opacity:1; } 50% { opacity:.5; } }
@keyframes gm-blink { 0%,41%,45%,100% { transform:scaleY(1); } 42%,44% { transform:scaleY(.12); } }
@media (prefers-reduced-motion:reduce) { .gm-card,.gm-lens,.gm-shadow,.gm-highlight,.gm-indicator,.gm-eye { animation:none !important; } }
</style>
